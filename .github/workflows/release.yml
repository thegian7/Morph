name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS binary covers Apple Silicon and Intel, so we no
          # longer need a separate macos-13 (Intel) runner.
          - target: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - target: windows
            os: windows-latest
            rust-targets: ''
            build-args: ''
            bundle-dir: src-tauri/target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # google.rs reads these with option_env!, so a build without them compiles
      # fine and silently ships with Google Calendar unusable. Fail loudly here
      # instead of publishing a broken installer.
      - name: Verify OAuth credentials are configured
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are not set on this repository."
            echo "::error::Set them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # @tauri-apps/cli is already a devDependency, so npm ci gives us a
      # lockfile-pinned CLI. `cargo install tauri-cli` rebuilt it from source on
      # every run, costing ~10 minutes per job.
      - name: Build Tauri app
        run: npx tauri build ${{ matrix.build-args }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: List bundle output
        shell: bash
        run: find "${{ matrix.bundle-dir }}" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \)

      # macOS: upload .dmg
      - name: Upload macOS DMG
        if: startsWith(matrix.target, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: morph-${{ matrix.target }}
          path: ${{ matrix.bundle-dir }}/dmg/*.dmg
          if-no-files-found: error

      # Windows: upload .msi and .exe
      - name: Upload Windows MSI
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: morph-windows-msi
          path: ${{ matrix.bundle-dir }}/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows NSIS
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: morph-windows-nsis
          path: ${{ matrix.bundle-dir }}/nsis/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
